<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Styrka</title>
  <meta name="description" content="Personligt styrketräningsprogram för nybörjare, 3 pass i veckan – Push, Pull, Legs." />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Styrka</h1>
    <button class="lib-btn" id="library-btn" aria-label="Övningsbibliotek">Bibliotek</button>
    <button class="info-btn" id="info-toggle" aria-label="Visa info">Info</button>
  </header>

  <div id="info-panel" class="info-panel" hidden>
    <ul>
      <li>3 pass i veckan, minst 1 vilodag mellan varje pass.</li>
      <li>Vila 60–120 s mellan seten (se förslag per övning).</li>
      <li>Öka vikten lite när alla set känns lätta – progressiv överbelastning.</li>
      <li>Allt sparas lokalt i din telefon, inget skickas till nätet.</li>
    </ul>
    <button class="force-update-btn" id="force-update-btn" aria-label="Tvinga uppdatering">Tvinga uppdatering</button>
  </div>

  <main>
    <div id="program"></div>
    <section id="log" class="log"></section>
  </main>

  <script src="fit-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
